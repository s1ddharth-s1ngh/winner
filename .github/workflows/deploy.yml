name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Public by design: both values ship inside the built JS. Data is protected by auth + RLS.
    env:
      VITE_SUPABASE_URL: https://polaqebdiwycachxrdpb.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n3SmpM53RBno2D7HoJ3OdA_cBojTLWN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
      # GitHub Pages has no SPA fallback: serve the app for unknown paths too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
